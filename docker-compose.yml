
volumes:
  mongodb_data:

networks:
  api_network:
    driver: bridge

services:
  api:
    container_name: api_container
    build:
      context: .
      dockerfile: Dockerfile
    
    env_file:
      - .env
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    networks:
      - api_network

  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    environment: []
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - api_network
    restart: always

  
